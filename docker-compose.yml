services:

  db:
    image: postgres:15

    container_name: fastapi_postgres

    environment:
      POSTGRES_DB: fastapi_tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .

    container_name: fastapi_api

    ports:
      - "8000:8000"

    depends_on:
      - db

volumes:
  postgres_data: