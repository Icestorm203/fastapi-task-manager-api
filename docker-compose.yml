services:

  db:
    image: postgres:15

    container_name: fastapi_postgres

    environment:
      POSTGRES_DB: fastapi_tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .

    container_name: fastapi_api

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fastapi_tasks

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: